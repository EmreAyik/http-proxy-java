# dnsmasq configuration for the transparent proxy.
#
# The single line `address=/#/172.28.0.3` tells dnsmasq to answer every
# A query, for every domain, with the proxy container's static IP. This
# is the DNS poisoning that makes the proxy "transparent" to clients.

port=53
listen-address=0.0.0.0
bind-interfaces
no-resolv
no-hosts
log-queries
log-facility=-

# Wildcard A record: every hostname -> proxy server.
address=/#/172.28.0.3
